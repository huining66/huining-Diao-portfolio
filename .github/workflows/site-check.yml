name: Portfolio quality checks
on:
  workflow_dispatch:
  push:
    paths:
      - '**.html'
      - 'assets/**'
      - 'data/wellbeing/**'
      - 'analysis/wellbeing.py'
      - '.github/workflows/site-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 analysis/wellbeing.py
      - name: Validate pages, assets and responsive layouts
        run: |
          python3 -m http.server 8765 > /tmp/site.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const failures=[];
            for(const width of [1440,390]){
              const page=await browser.newPage({viewport:{width,height:900}});
              page.on('pageerror',e=>failures.push(String(e)));
              for(const file of fs.readdirSync('.').filter(x=>x.endsWith('.html'))){
                await page.goto('http://localhost:8765/'+file);
                const issues=await page.evaluate(async()=>{
                  const errors=[];
                  if(document.documentElement.scrollWidth>innerWidth+2)errors.push('horizontal overflow');
                  for(const img of document.images){img.loading='eager';try{await img.decode()}catch{errors.push('image: '+img.src)}}
                  for(const a of document.querySelectorAll('a[href]')){
                    const u=new URL(a.href);
                    if(u.origin!==location.origin)continue;
                    const res=await fetch(u.pathname);
                    if(!res.ok)errors.push('link: '+a.href);
                    if(u.hash&&u.pathname===location.pathname&&!document.getElementById(decodeURIComponent(u.hash.slice(1))))errors.push('anchor: '+a.href);
                  }
                  return errors;
                });
                failures.push(...issues.map(e=>width+' '+file+' '+e));
                console.log(width,file,issues.length?'FAIL':'PASS');
              }
              await page.goto('http://localhost:8765/');
              if(await page.locator('#featured article').count()!==3)failures.push('featured research count incorrect');
              if(await page.locator('#skill-evidence article').count()!==4)failures.push('skill evidence count incorrect');
              if(await page.locator('#journey details').count()!==6)failures.push('career milestones count incorrect');
              const milestone=page.locator('#journey details').first();
              await milestone.locator('summary').click();
              if(await milestone.getAttribute('open')===null)failures.push('career milestone expansion failed');
              await milestone.locator('summary').click();
              if(await milestone.getAttribute('open')!==null)failures.push('career milestone collapse failed');
              await page.locator('#language-toggle').click();
              if(await page.locator('#featured h2').textContent()!=='精选研究')failures.push('Chinese homepage translation failed');
              await page.reload();
              if(await page.locator('#featured h2').textContent()!=='精选研究')failures.push('language preference persistence failed');
              if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))failures.push('Chinese layout overflow');
              await page.locator('#language-toggle').click();
              if(await page.locator('#featured h2').textContent()!=='Featured research')failures.push('English restoration failed');
              await page.locator('#studio-search').click();
              await page.locator('#studio-query').fill('SHAP');
              if(await page.locator('#studio-results a').count()!==1)failures.push('global search failed');
              await page.keyboard.press('Escape');
              await page.screenshot({path:'theme-light-'+width+'.png',fullPage:true});
              const palette=()=>page.evaluate(()=>['header','.terminal'].map(s=>{const c=getComputedStyle(document.querySelector(s));return c.backgroundColor+' '+c.backgroundImage}));
              const lightPalette=await palette();
              const lightBackground=await page.locator('body').evaluate(e=>getComputedStyle(e).backgroundColor);
              await page.locator('#studio-theme').click();
              await page.waitForTimeout(350);
              const darkBackground=await page.locator('body').evaluate(e=>getComputedStyle(e).backgroundColor);
              if(darkBackground===lightBackground||darkBackground!=='rgb(17, 29, 44)')failures.push('theme background incorrect '+width+': '+lightBackground+' -> '+darkBackground);
              if(await page.locator('html').getAttribute('data-theme')!=='dark')failures.push('theme toggle failed');
              await page.waitForTimeout(350);
              const darkPalette=await palette();
              if(lightPalette.some((v,i)=>v===darkPalette[i]))failures.push('header or terminal palette unchanged '+width);
              await page.screenshot({path:'theme-dark-'+width+'.png',fullPage:true});
              await page.reload();
              if(await page.locator('html').getAttribute('data-theme')!=='dark')failures.push('theme persistence failed');
              await page.goto('http://localhost:8765/research-lab.html');
              if(await page.locator('html').getAttribute('data-theme')!=='dark')failures.push('cross-page theme persistence failed');
              await page.goto('http://localhost:8765/');
              await page.locator('#studio-theme').click();
              await page.waitForTimeout(350);
              if(await page.locator('body').evaluate(e=>getComputedStyle(e).backgroundColor)!==lightBackground)failures.push('light background restoration failed');
              await page.locator('[data-metric="ml"]').click();
              if(await page.locator('#terminal-value').textContent()!=='0.8454')failures.push('terminal ML metric incorrect');
              await page.locator('[data-metric="econ"]').click();
              if(await page.locator('#terminal-value').textContent()!=='72.49%')failures.push('terminal economics metric incorrect');
              await page.locator('[data-filter="finance"]').click();
              if(await page.locator('.project-grid>.card:visible').count()!==2)failures.push('finance filter failed');
              await page.locator('[data-filter="all"]').click();
              if(await page.locator('.project-grid>.card:visible').count()!==5)failures.push('reset filter failed');
              await page.goto('http://localhost:8765/research-lab.html');
              const biz=page.locator('#biz-result');
              if(!(await biz.textContent()).includes('$15,000'))failures.push('business default profit incorrect');
              await page.locator('#biz-units').fill('2000');
              if(!(await biz.textContent()).includes('$50,000'))failures.push('business scenario profit incorrect');
              await page.locator('#biz-price').fill('40');
              if(!(await biz.textContent()).includes('N/A'))failures.push('business break-even edge case incorrect');
              await page.locator('#biz-units').fill('-1');
              if(!(await biz.textContent()).includes('Enter valid'))failures.push('business invalid input not rejected');
              const ml=page.locator('#ml-result');
              if(!(await ml.textContent()).includes('Recall 66.7%'))failures.push('ML default recall incorrect');
              await page.locator('#ml-threshold').fill('100');
              if(!(await ml.textContent()).includes('Precision N/A'))failures.push('ML undefined precision incorrect');
              await page.locator('#ml-threshold').fill('0');
              if(!(await ml.textContent()).includes('Recall 100.0%'))failures.push('ML zero threshold recall incorrect');
              const chartBefore=await page.locator('#allocation-chart').innerHTML();
              await page.locator('#weight').fill('75');
              if(chartBefore===await page.locator('#allocation-chart').innerHTML())failures.push('allocation chart unchanged');
              const before=await page.locator('#portfolio').textContent();
              await page.locator('#weight').fill('80');
              if(before===await page.locator('#portfolio').textContent())failures.push('allocation output unchanged');
              const check=async(id,expected)=>{const actual=await page.locator('#'+id).textContent();if(!actual.includes(expected))failures.push(id+' expected '+expected+' got '+actual)};
              await page.locator('#weight').fill('100');
              await check('portfolio','8% return | 18% risk');
              await page.locator('#discount').fill('10');
              await page.locator('#growth').fill('2');
              await check('dcf',String.fromCharCode(36));
              await page.locator('#discount').fill('2');
              await check('dcf','discount rate must exceed growth');
              if(await page.locator('#dcf-chart rect').count())failures.push('DCF chart shows results for invalid rates');
              await page.locator('#discount').fill('10');
              if(await page.locator('#dcf-chart rect').count()!==5)failures.push('DCF chart did not recover after valid input');
              await check('ab','3 pp | z = 2.1');
              await page.locator('#control').fill('1001');
              await check('ab','Enter valid counts');
              await check('var','$2,072.32');
              await page.locator('#vol').fill('201');
              await check('var','Enter valid portfolio');
              await page.goto('http://localhost:8765/dashboard.html');
              await page.locator('#filter').selectOption('One year');
              if(!(await page.locator('#metrics').textContent()).includes('1,473'))failures.push('dashboard annual contract count incorrect');
              await page.goto('http://localhost:8765/wellbeing.html');
              await page.waitForFunction(()=>document.querySelector('#stats').textContent.includes('120 observations'));
              await check('stats','-0.476');
              await page.locator('#region').selectOption('Oceania');
              await check('stats','not reported (small sample)');
              await page.locator('#region').selectOption('Europe');
              await check('stats','38 observations');
              await page.locator('#country').selectOption('France');
              await check('detail','France');
              await page.locator('#compare-a').selectOption('United States');
              await page.locator('#compare-b').selectOption('China');
              await check('comparison','-539 annual hours');
              await check('comparison','0.752');
              const map=page.locator('#world-map');
              await page.locator('#map-country').selectOption({label:'France'});
              await check('map-detail','France');
              if(await map.locator('[data-selected]').getAttribute('data-country')!=='FRA')failures.push('map selection failed');
              await page.locator('#map-in').click();
              const zoomedView=await map.getAttribute('viewBox');
              if(zoomedView==='0 0 720 360')failures.push('map zoom failed');
              await map.press('ArrowRight');
              if(await map.getAttribute('viewBox')===zoomedView)failures.push('map keyboard pan failed');
              await page.locator('#map-reset').click();
              if(await map.getAttribute('viewBox')!=='0 0 720 360')failures.push('map reset failed');
              const france=map.locator('[data-country="FRA"]');
              const initialFill=await france.getAttribute('fill');
              await france.evaluate(e=>e.dataset.reuseCheck='yes');
              await page.locator('#map-metric').selectOption('hours');
              if(await france.getAttribute('fill')===initialFill)failures.push('map metric color unchanged');
              if(await france.getAttribute('data-reuse-check')!=='yes')failures.push('map geometry unnecessarily rebuilt');
              await page.waitForSelector('#extended-results table');
              if(await page.locator('#extended-results tr').count()!==4)failures.push('model table incomplete');
              for(const path of ['report.pdf','matched-gdp.csv','models.json']){
                const response=await page.request.get('http://localhost:8765/data/wellbeing/'+path);
                if(!response.ok())failures.push('missing extended output '+path);
              }
              const coverage=await page.locator('#world-map path[data-country]').count();
              if(coverage<100)failures.push('map coverage below 100: '+coverage);
              await page.locator('#region').selectOption('Oceania');
              if(await page.locator('#scatter line[stroke="#b45309"]').count())failures.push('small sample trend displayed');
              if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))failures.push('async layout overflow '+width);
              const pdf=await page.request.get('http://localhost:8765/data/wellbeing/report.pdf');
              if((await pdf.body()).subarray(0,5).toString()!=='%PDF-')failures.push('invalid PDF signature');
              const models=await (await page.request.get('http://localhost:8765/data/wellbeing/models.json')).json();
              if(models.models.full_unadjusted.n!==120||models.models.matched_adjusted.n!==118)failures.push('unexpected model sample sizes');
              await page.screenshot({path:'wellbeing-'+width+'.png',fullPage:true});
              await page.close();
            }
            await browser.close();
            if(failures.length){console.error(failures.join('\n'));process.exitCode=1}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wellbeing-browser-screenshots
          path: |
            wellbeing-*.png
            theme-*.png
